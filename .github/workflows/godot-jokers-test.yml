name: Build isolated Joker's Jewels Godot test
on:
  push:
    branches: [main]
    paths:
      - "godot-test/source.zip"
      - ".github/workflows/godot-jokers-test.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack isolated Godot project
        run: unzip -q godot-test/source.zip -d "$RUNNER_TEMP/joker-godot"
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64' -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install minimal official Web export template
        run: python3 "$RUNNER_TEMP/joker-godot/install_web_template.py"
      - name: Smoke test the Godot scene
        run: "$GODOT" --headless --path "$RUNNER_TEMP/joker-godot/project" --script res://godot/tests/jokers_jewels/provider_port_smoke.gd
      - name: Export standalone test page
        run: |
          mkdir -p godot-test/jokers-jewels
          "$GODOT" --headless --path "$RUNNER_TEMP/joker-godot/project" --export-release Web "$GITHUB_WORKSPACE/godot-test/jokers-jewels/index.html"
      - name: Publish only the isolated Godot test folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f godot-test/jokers-jewels
          if git diff --cached --quiet; then echo "No build changes"; exit 0; fi
          git commit -m "Deploy isolated Godot Joker's Jewels test build"
          git push
