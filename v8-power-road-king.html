<!doctype html>
<html lang="es" data-skin="v8-road-king">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b11">
  <title>V8 Power Slots · Road King</title>
  <link rel="manifest" href="v8-power-road-king.webmanifest?v=v8-road-king-20261006-1">
  <script src="orientation-lock.js?v=portrait-lock-1" defer></script>
  <link rel="preload" as="image" href="assets/v8-power-road-king/frame.webp" fetchpriority="high">
  <link rel="stylesheet" href="style.css?v=single-portrait-15">
  <link rel="stylesheet" href="themes/skin-tokens.css?v=skin-refactor-1">
  <link rel="stylesheet" href="shared-portrait.css?v=single-canvas-4">
  <link rel="stylesheet" href="themes/v8-power-road-king.css?v=v8-road-king-20261006-34">
</head>
<body>
  <div class="orientation-warning" role="status" aria-live="polite">Poné el teléfono en vertical para jugar.</div>
  <section id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="loading-canvas">
      <img class="loading-art" src="assets/v8-power-road-king/loading.webp" alt="" fetchpriority="high" decoding="sync">
      <div class="loading-ui">
        <div class="loading-track"><div id="loadingBar" class="loading-fill"></div></div>
        <div class="loading-status"><span class="loading-label"><span id="loadingMessage">Cargando Road King</span><span id="loadingDots">...</span></span><b id="loadingPercent">0%</b></div>
      </div>
    </div>
  </section>
  <section id="lowWinScreen" class="lowwin-screen" aria-hidden="true">
    <div id="lowWinParticles" class="lowwin-particles"></div>
    <div class="lowwin-card"><img alt=""><div class="lowwin-title"></div><div class="lowwin-amount"><span id="lowWinNumber">0</span></div></div>
  </section>
  <section id="bigWinScreen" class="bigwin-screen" aria-hidden="true">
    <div class="bigwin-rays"></div><div id="bigWinParticles" class="bigwin-particles"></div><div class="bigwin-lights"></div>
    <div class="bigwin-card"><img class="bigwin-art" alt=""><div class="bigwin-number-cover"><div id="bigWinNumber" class="bigwin-number">0</div></div></div>
  </section>
  <main id="game" class="game">
    <picture class="frame"><source media="all"><img alt=""></picture>
    <img class="bet-bar" alt=""><img class="balance-bar" alt="">
    <section id="reels" class="reels" aria-label="Rodillos"></section>
    <section id="announcementPanel" class="announcement-panel rk-hud-strip" aria-label="Estado de la máscara"><img alt=""><div id="announcementText" class="announcement-text"></div></section>
    <img class="lines-bar" alt="">
    <section class="ui">
      <div class="display balance"><div class="control-box"><span class="label">SALDO</span><b id="balance" class="value">10000</b></div></div>
      <button id="betIndicator" class="display bet settings-indicator" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="rkSettingsMenu"><div class="control-box"><span class="label">APUESTA</span><b id="bet" class="value">50</b></div></button>
      <button id="linesIndicator" class="display lines settings-indicator" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="rkSettingsMenu"><div class="control-box"><span class="label">LÍNEAS</span><b id="lines" class="value">20</b></div></button>
      <div class="display win"><div class="control-box"><span class="label">PREMIO</span><b id="win" class="value">0</b></div></div>
      <div class="display jackpot"><span class="label" id="jackpotLabel">TESORO</span> <b id="jackpot">75420</b></div>
      <button id="spin" class="spin" type="button" aria-label="Girar"><img class="spin-art spin-art-normal" alt=""><img class="spin-art spin-art-pressed" alt=""></button>
      <button id="minus" class="betminus" type="button" aria-label="Bajar apuesta">−</button><button id="plus" class="betplus" type="button" aria-label="Subir apuesta">+</button>
      <button id="lineUp" class="lineup" type="button" aria-label="Más líneas">+</button><button id="lineDown" class="linedown" type="button" aria-label="Menos líneas">−</button>
      <button id="autoSpin" class="auto-spin" type="button" aria-pressed="false">AUTO</button><button id="menu" class="menu" type="button">INFO</button>
    </section>
  </main>
  <button id="autoStopOverlay" class="auto-stop-overlay" type="button">PARAR AUTO</button>
  <div id="rkSettingsMenu" class="rk-settings-menu" aria-hidden="true">
    <button id="settingsBackdrop" class="rk-settings-backdrop" type="button" aria-label="Cerrar configuración"></button>
    <section class="rk-settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <button id="closeSettingsMenu" class="rk-settings-close" type="button" aria-label="Cerrar">×</button>
      <h2 id="settingsTitle">CONFIGURAR</h2>
      <div id="betSetting" class="rk-setting-panel">
        <p class="rk-setting-label">APUESTA TOTAL</p>
        <div class="rk-bet-stepper"><button id="betStepDown" type="button" aria-label="Bajar apuesta">−</button><strong id="betSettingValue">25</strong><button id="betStepUp" type="button" aria-label="Subir apuesta">+</button></div>
        <p id="betStepHint" class="rk-setting-hint"></p>
      </div>
      <div id="lineSetting" class="rk-setting-panel" hidden>
        <p class="rk-setting-label">ELEGÍ CANTIDAD DE LÍNEAS</p>
        <div id="lineChoiceButtons" class="rk-line-choices"></div>
      </div>
    </section>
  </div>
  <div id="paytableModal" class="paytable-modal" aria-hidden="true">
    <div class="paytable-card"><button id="closePaytable" class="paytable-close" aria-label="Cerrar">×</button>
      <div class="paytable-brand"></div><h2></h2><p class="paytable-subtitle"></p>
      <table><thead><tr></tr></thead><tbody id="paytableRows"></tbody></table><div class="paytable-rules"><b></b></div>
    </div>
  </div>
  <script src="phaser.min.js?v=4.2.1"></script>
  <script src="themes/v8-power-road-king.js?v=v8-road-king-20261006-34"></script>
  <script src="main.js?v=v8-road-king-20261006-34"></script>
</body>
</html>
