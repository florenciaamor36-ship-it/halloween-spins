<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba de animación por capas - Caldero</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh}
#escena{position:relative;width:min(100vw,calc(100dvh * 1024 / 558));height:min(100dvh,calc(100vw * 558 / 1024));aspect-ratio:1024/558;overflow:hidden;background:#111;isolation:isolate}
#fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0}
#caldero{position:absolute;left:34.18%;top:16.13%;width:31.84%;height:75.09%;z-index:1;object-fit:fill;pointer-events:none}
#capa-animacion{position:absolute;inset:0;width:100%;height:100%;background:transparent;pointer-events:none;z-index:2}
</style>
</head>
<body>
<div id="escena" aria-label="Caldero con animación transparente de burbujas, humo y chispas">
<img id="fondo" src="./cauldron-background.jpg" alt="">
<img id="caldero" src="./cauldron-cutout.png" alt="">
<canvas id="capa-animacion" width="1024" height="558"></canvas>
</div>
<script>
const canvas=document.getElementById('capa-animacion');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const bubbles=[],smoke=[],fireSparks=[];
// Puntos de emisión medidos respecto de la imagen original 1024×558.
const centerX=512,liquidY=229,fireY=449;
for(let i=0;i<25;i++)bubbles.push({x:centerX+(Math.random()-.5)*190,y:liquidY+Math.random()*25,radius:Math.random()*6+3,speedY:Math.random()*1.05+.48,speedX:(Math.random()-.5)*.42,alpha:Math.random()*.8+.2,color:Math.random()>.5?'rgba(50, 255, 120,':'rgba(230, 80, 255,'});
for(let i=0;i<15;i++)smoke.push({x:centerX+(Math.random()-.5)*150,y:liquidY-10+Math.random()*28,radius:Math.random()*16+12,speedY:Math.random()*.7+.55,speedX:(Math.random()-.5)*.5,alpha:Math.random()*.3+.1});
for(let i=0;i<20;i++)fireSparks.push({x:centerX+(Math.random()-.5)*200,y:fireY+Math.random()*16,radius:Math.random()*3+1,speedY:Math.random()*1.45+.75,speedX:(Math.random()-.5)*.75,alpha:1});
function animate(){ctx.clearRect(0,0,W,H);
// Humo detrás del caldero: la zona de salida queda en el borde interno de la boca.
smoke.forEach(s=>{ctx.beginPath();const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.radius);g.addColorStop(0,`rgba(180,255,200,${s.alpha})`);g.addColorStop(1,'rgba(180,255,200,0)');ctx.fillStyle=g;ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);ctx.fill();s.y-=s.speedY;s.x+=s.speedX;s.radius+=.3;s.alpha-=.003;if(s.alpha<=0){s.x=centerX+(Math.random()-.5)*150;s.y=liquidY-2;s.radius=Math.random()*16+12;s.alpha=Math.random()*.3+.1}});
// Burbujas mágicas nacen dentro del líquido y suben por la abertura.
bubbles.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fillStyle=b.color+b.alpha+')';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.stroke();b.y-=b.speedY;b.x+=b.speedX;b.alpha-=.005;if(b.alpha<=0||b.y<liquidY-100){b.x=centerX+(Math.random()-.5)*190;b.y=liquidY+16;b.alpha=Math.random()*.8+.2}});
// Chispas suben desde el fuego visible debajo de la base de piedra.
fireSparks.forEach(f=>{ctx.beginPath();ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);ctx.fillStyle=`rgba(255,180,50,${f.alpha})`;ctx.fill();f.y-=f.speedY;f.x+=f.speedX;f.alpha-=.015;if(f.alpha<=0){f.x=centerX+(Math.random()-.5)*200;f.y=fireY+12;f.alpha=1}});
requestAnimationFrame(animate)}
animate();
</script>
</body>
</html>
