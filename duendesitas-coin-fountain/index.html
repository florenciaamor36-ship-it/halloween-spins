<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prueba aislada · Fuente de monedas doradas</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,sans-serif}
  #coinCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;background:transparent}
  .note{position:fixed;left:12px;top:12px;padding:8px 11px;border:1px solid #c8a84d;border-radius:9px;background:#19151dcc;color:#ffe59b;font-size:12px;z-index:2}
</style>
</head>
<body>
<div class="note">Prueba aislada · solo monedas doradas</div>
<canvas id="coinCanvas" aria-label="Fuente de monedas doradas"></canvas>
<script>
// Prototipo de la fuente, basado en el código de referencia de Florencia.
// Usa solamente sprites dorados recortados de su plantilla; no modifica el juego.
const canvas=document.getElementById('coinCanvas');
const ctx=canvas.getContext('2d',{alpha:true});
const DPR=Math.min(window.devicePixelRatio||1,2);
function resizeCanvas(){
  const w=window.innerWidth,h=window.innerHeight;
  canvas.width=Math.round(w*DPR);canvas.height=Math.round(h*DPR);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
const root='../assets/duendesitas-fortuna/coins/';
const frameNames=['gold-rotation-01','gold-rotation-02','gold-rotation-03','gold-rotation-04','gold-rotation-05','gold-rotation-07'];
const frames=frameNames.map(name=>{const im=new Image();im.src=root+name+'.png';return im});
const idleNames=['gold-idle-topdown','gold-idle-angled'];
const idles=idleNames.map(name=>{const im=new Image();im.src=root+name+'.png';return im});
const coins=[];const maxCoins=150;let launchTimer=[];
class Coin{
 constructor(){this.reset(true)}
 reset(initial=false){
  const w=window.innerWidth,h=window.innerHeight;
  this.x=w/2+(Math.random()*40-20);this.y=h*.70;
  this.vx=(Math.random()-.5)*12;this.vy=-(Math.random()*10+14);
  this.gravity=.5;this.size=Math.random()*12+16;
  this.angle=Math.random()*Math.PI*2;this.rotationSpeed=Math.random()*.2+.1;
  this.alpha=1;this.seed=Math.random()*Math.PI*2;
  this.idleIndex=Math.random()<.5?0:1;this.startY=this.y;
  if(!initial){this.y=h*.7;this.vx=(Math.random()-.5)*12;this.vy=-(Math.random()*10+14)}
 }
 update(){
  this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;
  this.angle+=this.rotationSpeed;
  this.alpha=Math.max(.28,1-Math.max(0,this.y-window.innerHeight*.48)/(window.innerHeight*.72));
  if(this.y>window.innerHeight+50)this.reset();
 }
 draw(){
  const frameIndex=Math.floor((Math.abs(Math.sin(this.angle))*frameNames.length))%frameNames.length;
  let image=frames[frameIndex];
  if(!image.complete||!image.naturalWidth)image=idles[this.idleIndex];
  if(!image.complete||!image.naturalWidth)return;
  const aspect=image.naturalWidth/image.naturalHeight;
  const h=this.size*2,w=h*aspect;
  const flip=Math.max(.08,Math.abs(Math.cos(this.angle)));
  ctx.save();ctx.globalAlpha=this.alpha;ctx.translate(this.x,this.y);ctx.scale(flip,1);
  ctx.drawImage(image,-w/2,-h/2,w,h);ctx.restore();
 }
}
for(let i=0;i<maxCoins;i++)launchTimer.push(window.setTimeout(()=>coins.push(new Coin()),i*35));
let raf=0;
function animate(){
 ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
 for(const coin of coins){coin.update();coin.draw()}
 raf=requestAnimationFrame(animate);
}
animate();
window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);launchTimer.forEach(clearTimeout)},{once:true});
</script>
</body>
</html>
