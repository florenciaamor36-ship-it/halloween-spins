<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Immortal Ways Buffalo — prototipo 5×5</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main class="machine" aria-label="Prototipo Immortal Ways Buffalo">
    <img class="frame-art" src="assets/frame/frame.webp" alt="Marco vertical Immortal Ways Buffalo con rejilla 5 por 5">
    <div id="grid" class="grid" role="grid" aria-label="Símbolos: cinco columnas por cinco filas"></div>
    <div class="meter" aria-live="polite"><span id="message">LISTO PARA GIRAR</span><b id="win">—</b></div>
    <div class="hud"><span>SALDO <b id="balance">1000.00</b></span><span>APUESTA <b id="bet">1.00</b></span></div>
    <button id="spin" class="spin" type="button">GIRAR</button>
    <div class="caption">PROTOTIPO · 5 RODILLOS × 5 FILAS · 20 LÍNEAS</div>
  </main>
  <script src="game.js?v=1"></script>
</body>
</html>
