<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wonders of Aztec — máscara experimental</title>
<style>
:root{color-scheme:dark;--gold:#ffdb68;--gold2:#a96512;--jade:#2dc88b;--ink:#080c10}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c10;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.game{position:relative;height:min(100dvh,177.78vw);width:min(100vw,56.25dvh);aspect-ratio:9/16;overflow:hidden;background:linear-gradient(#071019,#050807);isolation:isolate;box-shadow:0 0 34px #010305}.backdrop{position:absolute;inset:0;background:linear-gradient(#050a0c40,#080806dd 79%),url('../assets/wonders-of-aztec/background-vertical.jpg') center/100% 100%;z-index:-3}.ambient{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 40%,#96702938,transparent 50%),linear-gradient(90deg,#03080a82,transparent 45%,#03080a82);pointer-events:none;z-index:-1}.top{height:12%;display:flex;align-items:center;justify-content:space-between;padding:2.5% 4%;gap:8px}.brand{height:100%;max-width:48%;object-fit:contain;filter:drop-shadow(0 2px 7px #000)}.topbuttons{display:flex;gap:7px}.iconbtn,.smallbtn,.primary{color:#ffeab1;background:linear-gradient(150deg,#42321c,#111917);border:1px solid #d2a746;border-radius:10px;box-shadow:inset 0 1px #fff3,0 4px 10px #0008;font-weight:800}.iconbtn{width:42px;height:42px;font-size:19px}.jackpots{height:8%;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 3% 1.5%}.jp{border:1px solid #bd8a2f;border-radius:8px;background:linear-gradient(#271c13e8,#060b0aee);text-align:center;display:grid;align-content:center;box-shadow:inset 0 0 8px #000}.jp label{font-size:clamp(8px,2.15vw,12px);font-weight:900;letter-spacing:.08em;color:#f8df9a}.jp b{font-size:clamp(10px,2.8vw,16px);color:#fff3bb}.reel-wrap{position:relative;width:94%;height:40%;margin:0 auto;border:2px solid #d8a746;border-radius:15px;padding:2.1%;background:linear-gradient(130deg,#26190c,#0d1b16 44%,#162118 70%,#24170b);box-shadow:0 0 0 2px #583612,0 8px 24px #000b,inset 0 0 23px #be8b2530;overflow:hidden}.reels{width:100%;height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:3px;background:#080a08;border:1px solid #b88634;border-radius:9px;overflow:hidden}.cell{background:radial-gradient(ellipse,#3a3320,#101512 75%);display:grid;place-items:center;overflow:hidden;position:relative;min-width:0;min-height:0}.cell img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 3px 3px #000c);user-select:none}.cell .tile{animation:land .19s cubic-bezier(.14,.74,.32,1.24)}@keyframes land{from{transform:translateY(-17%) scale(.88);opacity:.6}to{transform:none;opacity:1}}.cell.rolling img{animation:spinning .18s linear infinite;filter:blur(1px)}@keyframes spinning{from{transform:translateY(-100%)}to{transform:translateY(100%)}}.cell.winning{background:radial-gradient(ellipse,#9f8021,#483318 70%);box-shadow:inset 0 0 17px #fff59b;z-index:1}.cell.winning img{animation:shine .4s infinite alternate;filter:drop-shadow(0 0 8px #ffe878)}@keyframes shine{to{transform:scale(1.12)}}.cell.bombed:after{content:'☼';position:absolute;color:#fff48e;text-shadow:0 0 12px #ffd434;font-size:30px;animation:pulse .7s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.45);opacity:.35}}.middle{height:8%;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:0 5%;gap:6px}.meter{text-align:center;background:#050908b8;border:1px solid #946d2b;border-radius:8px;padding:4px;min-width:0}.meter span{display:block;font-size:clamp(8px,2vw,11px);color:#dec68a;font-weight:800;letter-spacing:.1em}.meter strong{font-size:clamp(14px,4vw,22px);color:#fff2c5}.msg{font-size:clamp(10px,2.4vw,13px);color:#ffdf79;text-align:center;font-weight:900;text-shadow:0 2px #000}.buttons{height:12%;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 4%}.smallbtn{height:44px;min-width:48px;font-size:20px}.primary{width:72px;height:72px;border-radius:50%;font-size:30px;color:#fff1aa;background:radial-gradient(circle at 35% 25%,#e8c266,#79501c 55%,#1d160e);border:3px solid #eed27c;box-shadow:0 4px 0 #523513,0 7px 17px #000a,inset 0 0 9px #fff7}.primary:active,.smallbtn:active,.iconbtn:active{transform:translateY(2px)}.auto-ind{position:absolute;right:4%;bottom:2%;color:#d3bd82;font-size:10px;font-weight:bold}.legal{position:absolute;left:0;right:0;bottom:.7%;text-align:center;font-size:8px;color:#ebd29a99;letter-spacing:.08em;pointer-events:none}.overlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#020303cf;padding:8%}.overlay.open{display:flex}.panel{position:relative;width:100%;max-height:88%;overflow:auto;padding:24px 18px 18px;border:2px solid #c79842;border-radius:17px;background:linear-gradient(#193129f5,#090d0bf8 70%),url('../assets/wonders-of-aztec/frame.webp') center/cover;box-shadow:0 0 38px #000}.panel h2{margin:0 40px 16px 0;color:#ffdf83;text-transform:uppercase;font-size:20px}.close{position:absolute;right:12px;top:10px;background:transparent;border:1px solid #d2aa5c;color:#ffecbb;border-radius:50%;width:34px;height:34px;font-size:20px}.panel p,.panel li{font-size:14px;line-height:1.5;color:#f1e5ca}.panel button.choice{display:block;width:100%;margin:8px 0;padding:13px;border:1px solid #d9b45c;border-radius:9px;background:linear-gradient(#5d471f,#211b12);color:#fff1c8;font-weight:900;font-size:15px}.sound-toggle{position:absolute;top:2.7%;right:calc(4% + 96px);height:42px;width:42px;border-radius:10px;border:1px solid #d2a746;background:#101613;color:#ffecbb;font-size:18px;z-index:2}.smallnote{font-size:11px!important;color:#e0c989!important}
</style></head>
<body><main class="game"><div class="backdrop"></div><div class="ambient"></div>
<header class="top"><img class="brand" src="../assets/wonders-of-aztec/logo.webp" alt="Wonders of Aztec"><div class="topbuttons"><button id="mute" class="iconbtn" aria-label="Silenciar">♫</button><button id="info" class="iconbtn" aria-label="Información">ⓘ</button><button id="menu" class="iconbtn" aria-label="Menú">☰</button></div></header>
<section class="jackpots multipliers"><div class="jp"><label>REEL 1</label><b id="m0">×1</b></div><div class="jp"><label>REEL 2</label><b id="m1">×1</b></div><div class="jp"><label>REEL 3</label><b id="m2">×1</b></div><div class="jp"><label>REEL 4</label><b id="m3">×1</b></div><div class="jp"><label>REEL 5</label><b id="m4">×1</b></div><div class="jp"><label>REEL 6</label><b id="m5">×1</b></div></section>
<section class="reel-wrap"><div id="reels" class="reels" aria-label="Cuadrícula de 6 por 5"></div></section>
<section class="middle"><div class="meter"><span>SALDO</span><strong id="balance">1,000.00</strong></div><div class="msg" id="message">CRÉDITOS DE PRUEBA</div><div class="meter"><span>APUESTA</span><strong id="bet">1.00</strong></div></section>
<section class="buttons"><button id="minus" class="smallbtn" aria-label="Bajar apuesta">−</button><button id="buy" class="smallbtn" aria-label="Comprar bonus">✦</button><button id="spin" class="primary" aria-label="Girar">⟳</button><button id="auto" class="smallbtn" aria-label="Giros automáticos">Ⓐ</button><button id="plus" class="smallbtn" aria-label="Subir apuesta">+</button></section><div class="auto-ind" id="autoState"></div><div class="legal">RECONSTRUCCIÓN EXPERIMENTAL · CRÉDITOS FICTICIOS · MATEMÁTICA NO OFICIAL</div>
<div id="overlay" class="overlay"><div class="panel"><button id="close" class="close">×</button><div id="panelContent"></div></div></div></main>
<script>
(()=>{'use strict';
const A='../assets/wonders-of-aztec/',R=5,C=6,reg=['lowPurple','lowGreen','lowBlue','blue','green','purple','jaguar','red','yellow'];
const src={lowPurple:'symbol-low-purple.webp',lowGreen:'symbol-low-green.webp',lowBlue:'symbol-low-blue.webp',blue:'symbol-blue.webp',green:'symbol-green.webp',purple:'symbol-purple.webp',jaguar:'symbol-jaguar.webp',red:'red.webp',yellow:'yellow.webp',scatter:'scatter.webp',bomb:'bomb.webp'};
const pay={lowPurple:[.5,1,2],lowGreen:[.5,1,2],lowBlue:[.5,1,2],blue:[1,2,4],green:[1,2,4],purple:[2,4,8],jaguar:[4,10,20],red:[.5,1,2],yellow:[.5,1,2]};
const node=id=>document.getElementById(id),reels=node('reels'),cells=[];let balance=1000,bet=1,busy=false,muted=false,autoN=0,free=0,mults=Array(6).fill(1),audio={};
function mkAudio(key,loop=false){const x=new Audio(A+key);x.preload='auto';x.loop=loop;x.volume=.55;audio[key]=x;return x}mkAudio('spin-start.mp3');mkAudio('reel-stop.mp3');mkAudio('tumble.mp3');mkAudio('win.mp3');mkAudio('music.mp3',true);audio['music.mp3'].volume=.24;
function sfx(k){const a=audio[k];if(!muted&&a){try{if(k==='music.mp3'&&!a.paused)return;if(!a.loop)a.currentTime=0;a.play().catch(()=>{})}catch(_){}}}function stop(k){audio[k]?.pause();if(audio[k])audio[k].currentTime=0}function toggleMusic(){muted=!muted;node('mute').textContent=muted?'♪̸':'♫';if(muted)stop('music.mp3');else sfx('music.mp3')}
function rand(a){return a[Math.floor(Math.random()*a.length)]}function fmt(x){return Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function setMessage(s){node('message').textContent=s}
function update(){node('balance').textContent=fmt(balance);node('bet').textContent=fmt(bet);node('spin').disabled=busy;mults.forEach((m,i)=>node('m'+i).textContent='×'+m);node('autoState').textContent=autoN?`AUTO ${autoN}`:''}
function symbol(k,extra={}){return {k,...extra}}
function outcome(){let q=Math.random();if(q<.018)return symbol('scatter');if(q<.05)return symbol('bomb');return symbol(rand(reg))}
function newGrid(){return Array.from({length:C},()=>Array.from({length:R},outcome))}
function draw(g){g.forEach((col,c)=>col.forEach((s,r)=>{const cell=cells[r*C+c];cell.classList.remove('winning','bombed');cell.innerHTML='';if(!s)return;const im=document.createElement('img');im.className='tile';im.src=A+src[s.k];im.alt=s.k;im.draggable=false;cell.append(im)}))}
function init(){for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='cell';cells.push(d);reels.append(d)}draw(newGrid());update()}
function clearWin(){cells.forEach(x=>x.classList.remove('winning'))}
function score(g){const wins=[],counts={};g.flat().forEach(s=>{if(s?.k!=='scatter'&&s?.k!=='bomb')counts[s.k]=(counts[s.k]||0)+1});Object.entries(counts).forEach(([k,n])=>{if(n>=8){let amount=bet*pay[k][n>=13?2:n>=10?1:0];wins.push({k,n,amount})}});return wins}
function markWinning(g,wins){let left={};wins.forEach(w=>left[w.k]=w.n);g.forEach((col,c)=>col.forEach((s,r)=>{if(s&&left[s.k]>0){cells[r*C+c].classList.add('winning');left[s.k]--}}))}
async function tumble(g,wins){
 markWinning(g,wins);const total=wins.reduce((a,w)=>a+w.amount,0);balance+=total;node('balance').textContent=fmt(balance);setMessage('WIN '+fmt(total));sfx('win.mp3');await sleep(650);sfx('tumble.mp3');
 const won=new Set(wins.map(w=>w.k));for(let c=0;c<C;c++)for(let r=0;r<R;r++)if(g[c][r]?.k==='bomb'&&wins.length){mults[c]=Math.min(128,mults[c]*2);cells[r*C+c].classList.add('bombed')}update();
 for(let c=0;c<C;c++){g[c]=g[c].filter(s=>!won.has(s.k));while(g[c].length<R)g[c].unshift(outcome())}draw(g);return total
}
const sleep=t=>new Promise(r=>setTimeout(r,t));
async function spin(){if(busy)return;busy=true;autoN=Math.max(0,autoN-1);let isFree=free>0;let cost=isFree?0:bet;if(isFree)free--;if(!isFree)mults=Array(6).fill(1);if(balance<cost){setMessage('SALDO INSUFICIENTE');busy=false;autoN=0;update();return}balance-=cost;update();setMessage(isFree?'TIRADA GRATIS · '+(free+1):'¡GIRANDO!');sfx('spin-start.mp3');if(!muted)sfx('music.mp3');const g=newGrid(),timers=[];for(let c=0;c<C;c++){for(let r=0;r<R;r++)cells[r*C+c].classList.add('rolling');timers[c]=setInterval(()=>{for(let r=0;r<R;r++){const tile=cells[r*C+c].querySelector('img');if(tile)tile.src=A+src[outcome().k]}},105)}await sleep(950);for(let c=0;c<C;c++){await sleep(155+(c===5?250:0));clearInterval(timers[c]);for(let r=0;r<R;r++){const cell=cells[r*C+c];cell.classList.remove('rolling');cell.innerHTML='';const im=document.createElement('img');im.className='tile';im.src=A+src[g[c][r].k];im.alt=g[c][r].k;cell.append(im)}sfx('reel-stop.mp3')}let total=0;let loops=0;while(loops++<8){let wins=score(g);if(!wins.length)break;total+=await tumble(g,wins)}const active=mults.filter(x=>x>1);const multiplier=active.reduce((a,b)=>a+b,0)||1;if(total>0&&multiplier>1){const extra=total*(multiplier-1);balance+=extra;setMessage('MULTIPLICADOR ×'+multiplier+' · WIN '+fmt(total+extra));update();await sleep(900)}let sc=g.flat().filter(x=>x?.k==='scatter').length;if(sc>=4){free+=isFree?5:sc>=6?30:sc===5?20:10;setMessage('¡TIRADAS GRATIS! '+free)}if(!total&&sc<4)setMessage('BUENA SUERTE');if(free>0){await sleep(600);busy=false;update();await spin();return}busy=false;update();if(autoN>0){await sleep(250);void spin()}}
function panel(html){node('panelContent').innerHTML=html;node('overlay').classList.add('open')}function close(){node('overlay').classList.remove('open')}
function info(){panel(`<h2>WONDERS OF AZTEC</h2><p>Cuadrícula 6×5 · 8 o más símbolos iguales pagan en cualquier posición · cascadas · multiplicadores por rodillo.</p><p>En esta versión de prueba, los premios, frecuencias, multiplicadores y activadores son simulados: no son matemáticas oficiales ni dinero real.</p><button class="choice" onclick="window.azReset()">Reiniciar créditos de prueba</button>`)}
function openMenu(){panel(`<h2>MENÚ DE PRUEBA</h2><p>Wonders of Aztec — máscara separada.</p><p><a href="../index.html" style="color:#ffdb68">Menú de máquinas</a></p><p>Créditos ficticios. La compra de bonus todavía está desactivada para no cobrar por una función no validada.</p>`)}
node('spin').onclick=()=>spin();node('minus').onclick=()=>{if(!busy)bet=Math.max(.2,Math.round((bet-.2)*100)/100);update()};node('plus').onclick=()=>{if(!busy)bet=Math.min(240,Math.round((bet+.2)*100)/100);update()};node('buy').onclick=()=>panel('<h2>COMPRA DE BONUS</h2><p>Señalada en las referencias del juego, pero su coste exacto y ejecución no fueron verificados. Queda desactivada en esta demo.</p>');node('auto').onclick=()=>{if(autoN){autoN=0;setMessage('AUTO DETENIDO');update()}else if(!busy)panel('<h2>GIROS AUTOMÁTICOS</h2><button class="choice" onclick="window.azAuto(10)">10 GIROS</button><button class="choice" onclick="window.azAuto(25)">25 GIROS</button>')};node('info').onclick=info;node('menu').onclick=openMenu;node('mute').onclick=toggleMusic;node('close').onclick=close;node('overlay').onclick=e=>{if(e.target===node('overlay'))close()};window.azAuto=n=>{close();autoN=n;spin()};window.azReset=()=>{balance=1000;free=0;autoN=0;update();close()};init();
})();
</script></body></html>
