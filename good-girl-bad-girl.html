<!doctype html>
<html lang="es" data-skin="good-girl-bad-girl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100a0d">
  <title>Good Girl Bad Girl · Tragamonedas</title>
  <link rel="stylesheet" href="style.css?v=ggbg-original-art-correction-20261014-1">
  <link rel="stylesheet" href="themes/skin-tokens.css?v=skin-tokens-1">
  <link rel="stylesheet" href="themes/good-girl-bad-girl.css?v=ggbg-original-art-correction-20261014-1">
</head>
<body>
  <div class="orientation-warning" role="status">Poné el teléfono en horizontal para jugar.</div>
  <section id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="loading-canvas">
      <img class="loading-art" alt="Pantalla de carga Good Girl Bad Girl">
      <div class="loading-ui">
        <div class="loading-track"><div id="loadingBar" class="loading-fill"></div></div>
        <div class="loading-status"><span id="loadingMessage">Cargando</span><span id="loadingDots">...</span> <b id="loadingPercent">0%</b></div>
      </div>
    </div>
  </section>
  <section id="lowWinScreen" class="lowwin-screen" aria-hidden="true">
    <div id="lowWinParticles" class="lowwin-particles"></div><div class="lowwin-flames" aria-hidden="true">✦ ✦ ✦</div>
    <div class="lowwin-card"><img alt=""><div class="lowwin-title"></div><div class="lowwin-amount"><span id="lowWinNumber">0</span></div></div>
  </section>
  <section id="bigWinScreen" class="bigwin-screen" aria-hidden="true">
    <div class="bigwin-rays"></div><div id="bigWinParticles" class="bigwin-particles"></div><div class="bigwin-lights"></div>
    <div class="bigwin-card"><img class="bigwin-art" alt=""><div class="bigwin-number-cover"><div id="bigWinNumber" class="bigwin-number">0</div></div></div>
  </section>
  <main id="game" class="game">
    <picture class="frame"><source media="all"><img alt=""></picture>
    <img class="bet-bar" alt=""><img class="balance-bar" alt="">
    <section id="reels" class="reels" aria-label="Rodillos"></section>
    <section id="announcementPanel" class="announcement-panel" aria-label="Estado del juego"><img alt=""><div id="announcementText" class="announcement-text"></div></section>
    <img class="lines-bar" alt="">
    <section class="ui">
      <div class="display balance"><div class="control-box"><span class="label">SALDO</span><b id="balance" class="value">1000</b></div></div>
      <div class="display bet"><div class="control-box"><span class="label">APUESTA</span><b id="bet" class="value">10</b></div></div>
      <div class="display lines"><div class="control-box"><span class="label">LÍNEAS</span><b id="lines" class="value">10</b></div></div>
      <div class="display win"><div class="control-box"><span class="label">PREMIO</span><b id="win" class="value">0</b></div></div>
      <div class="display jackpot"><span class="label" id="jackpotLabel">JACKPOT</span> <b id="jackpot">0</b></div>
      <button id="spin" class="spin" type="button" aria-label="Girar"><img class="spin-art spin-art-normal" alt=""><img class="spin-art spin-art-pressed" alt=""></button>
      <button id="minus" class="betminus" type="button" aria-label="Bajar apuesta">−</button><button id="plus" class="betplus" type="button" aria-label="Subir apuesta">+</button>
      <button id="maxBet" class="ggbg-max-bet" type="button" aria-label="Apuesta máxima">MAX BET</button><button id="ggbgInfo" class="ggbg-info-hit" type="button" aria-label="Ver premios">INFO</button>
      <button id="buyBonus" class="ggbg-buy-bonus" type="button" aria-label="Consultar compra de bonus">BUY BONUS</button><button id="ggbgHamburger" class="ggbg-hamburger-hit" type="button" aria-label="Abrir menú">Menú</button>
      <button id="lineUp" class="lineup" type="button" aria-label="Más líneas">+</button><button id="lineDown" class="linedown" type="button" aria-label="Menos líneas">−</button>
      <button id="autoSpin" class="auto-spin" type="button" aria-pressed="false">AUTO</button><button id="menu" class="menu" type="button" aria-label="Menú">MENÚ</button>
    </section>
  </main>
  <button id="autoStopOverlay" class="auto-stop-overlay" type="button">PARAR AUTO</button>
  <div id="paytableModal" class="paytable-modal" aria-hidden="true">
    <div class="paytable-card"><button id="closePaytable" class="paytable-close" aria-label="Cerrar">×</button>
      <div class="paytable-brand"></div><h2></h2><p class="paytable-subtitle"></p>
      <table><thead><tr></tr></thead><tbody id="paytableRows"></tbody></table><div class="paytable-rules"><b></b></div>
    </div>
  </div>
  <script src="phaser.min.js?v=4.2.1"></script>
  <script src="themes/good-girl-bad-girl.js?v=ggbg-wildfire-max60-20261014-1"></script>
  <script src="main.js?v=ggbg-wildfire-max60-20261014-1"></script>
</body>
</html>
