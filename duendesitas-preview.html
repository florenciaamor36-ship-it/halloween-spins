<style id="duendesitas-only-skin">
html[data-skin="duendesitas-fortuna"] .loading-canvas{position:relative;overflow:hidden}
html[data-skin="duendesitas-fortuna"] .loading-art{width:100%!important;height:100%!important;max-width:56.25vh!important;object-fit:cover!important}
html[data-skin="duendesitas-fortuna"] .loading-canvas:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 13% 18%,#fffbd9 0 1px,transparent 3px),radial-gradient(circle at 28% 30%,#e9ff9a 0 1.5px,transparent 4px),radial-gradient(circle at 72% 20%,#ffe985 0 1px,transparent 3px),radial-gradient(circle at 85% 36%,#d6ff92 0 1.5px,transparent 4px),radial-gradient(circle at 20% 61%,#ffe985 0 1px,transparent 3px),radial-gradient(circle at 77% 68%,#e9ff9a 0 1.5px,transparent 4px),radial-gradient(circle at 52% 47%,#fffbd9 0 1px,transparent 3px);animation:duendeFireflies 1.8s ease-in-out infinite alternate}
@keyframes duendeFireflies{0%{opacity:.25;filter:brightness(.9)}50%{opacity:.92;filter:brightness(1.6)}100%{opacity:.42;filter:brightness(1.15)}}

html[data-skin="duendesitas-fortuna"] #game .display.lines{left:auto!important;right:13%!important;top:80%!important;width:26%!important;height:4%!important}

html[data-skin="duendesitas-fortuna"] #game .ui button{z-index:9!important;opacity:1!important;border:1px solid #e6d37e!important;border-radius:12px!important;background:linear-gradient(#356d37,#173a29)!important;color:#fff1a5!important;text-shadow:0 1px 4px #000!important;box-shadow:0 3px 8px #0008!important;font-size:clamp(10px,2.5vw,15px)!important}

html[data-skin="duendesitas-fortuna"] #game .spin-art{display:none!important}
html[data-skin="duendesitas-fortuna"] #game .spin:after{content:"GIRAR";font-weight:900}
html[data-skin="duendesitas-fortuna"] #game .auto-spin{left:7%!important;top:93%!important;width:25%!important;height:5%!important}
html[data-skin="duendesitas-fortuna"] #game .menu{left:auto!important;right:7%!important;top:93%!important;width:25%!important;height:5%!important}
html[data-skin="duendesitas-fortuna"] #game .betminus{left:9%!important;top:79%!important;width:6%!important;height:5%!important}
html[data-skin="duendesitas-fortuna"] #game .betplus{left:43%!important;top:79%!important;width:5%!important;height:5%!important}
html[data-skin="duendesitas-fortuna"] #game .lineup{left:auto!important;right:9%!important;top:79%!important;width:6%!important;height:5%!important}
html[data-skin="duendesitas-fortuna"] #game .linedown{left:auto!important;right:43%!important;top:79%!important;width:5%!important;height:5%!important}
html[data-skin="duendesitas-fortuna"] #game .announcement-panel{display:none!important}
html[data-skin="duendesitas-fortuna"] #game .announcement-panel.rk-message-active{display:block!important;left:18%!important;right:auto!important;top:8%!important;bottom:auto!important;width:64%!important;height:auto!important;min-height:0!important;padding:5px 8px!important;z-index:10!important;background:rgba(12,28,19,.94)!important;border:1px solid #d6bd65!important;border-radius:9px!important;box-shadow:0 2px 8px #0009!important;font-size:clamp(9px,2vw,13px)!important;line-height:1.15!important;transform:none!important;grid-template-columns:1fr!important}
html[data-skin="duendesitas-fortuna"] #game .announcement-panel img{display:none!important}
html[data-skin="duendesitas-fortuna"] .bigwin-art,html[data-skin="duendesitas-fortuna"] .lowwin-card img{display:none!important}
/* Celebration overlays: win art below, centered gold fountain above it, fairy on top. */
html[data-skin="duendesitas-fortuna"] .award-coin-fountain{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;background:transparent}
html[data-skin="duendesitas-fortuna"] .award-fairy-stage{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);pointer-events:none;animation:duendeFloat 1.7s ease-in-out infinite}
html[data-skin="duendesitas-fortuna"] .award-fairy-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px #0008);transition:opacity .12s linear}
@keyframes duendeFloat{0%,100%{translate:0 0;rotate:-1deg}50%{translate:0 -4px;rotate:1deg}}
html[data-skin="duendesitas-fortuna"] .bigwin-card,html[data-skin="duendesitas-fortuna"] .lowwin-card{background:linear-gradient(145deg,#173a29,#243e25)!important;border:2px solid #e6d37e!important;border-radius:24px!important}
html[data-skin="duendesitas-fortuna"] .paytable-card{background-image:none!important;background:linear-gradient(145deg,#142a1e,#241d32)!important;border:2px solid #d6bd65!important}
</style>
</head>
<body>
  <div class="orientation-warning" role="status" aria-live="polite">Poné el teléfono en vertical para jugar.</div>
  <section id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="loading-canvas">
      <img class="loading-art" alt="">
      <div class="loading-ui">
        <div class="loading-track"><div id="loadingBar" class="loading-fill"></div></div>
        <div class="loading-status"><span id="loadingMessage">Cargando</span><span id="loadingDots">...</span> <b id="loadingPercent">0%</b></div>
      </div>
    </div>
  </section>
  <section id="lowWinScreen" class="lowwin-screen" aria-hidden="true">
    <div id="lowWinParticles" class="lowwin-particles"></div>
    <div class="lowwin-flames" aria-hidden="true">🔥 🔥 🔥</div>
    <div class="lowwin-card"><img alt=""><div class="lowwin-title"></div><div class="lowwin-amount"><span id="lowWinNumber">0</span></div></div>
    <canvas class="award-coin-fountain" aria-hidden="true"></canvas>
    <div class="award-fairy-stage" aria-hidden="true"><img class="award-fairy" alt=""><img class="award-fairy-next" alt="" style="opacity:0"></div>
  </section>
  <section id="bigWinScreen" class="bigwin-screen" aria-hidden="true">
    <div class="bigwin-rays"></div><div id="bigWinParticles" class="bigwin-particles"></div><div class="bigwin-lights"></div>
    <div class="bigwin-card"><img class="bigwin-art" alt=""><div class="bigwin-number-cover"><div id="bigWinNumber" class="bigwin-number">0</div></div></div>
    <canvas class="award-coin-fountain" aria-hidden="true"></canvas>
    <div class="award-fairy-stage" aria-hidden="true"><img class="award-fairy" alt=""><img class="award-fairy-next" alt="" style="opacity:0"></div>
  </section>
  <a href="index.html" style="position:fixed;z-index:9999;left:12px;top:12px;padding:8px 12px;border:1px solid #ffe18e;border-radius:10px;background:#171027;color:#fff0b2;font:700 12px system-ui;text-decoration:none">← Menú de máquinas</a>
<main id="game" class="game">
    <picture class="frame"><source media="all"><img alt=""></picture>
    <img class="bet-bar" alt=""><img class="balance-bar" alt="">
    <section id="reels" class="reels" aria-label="Rodillos"></section>
    <section id="announcementPanel" class="announcement-panel" aria-label="Anuncios del juego"><img alt="Panel de anuncios"><div id="announcementText" class="announcement-text"></div></section>
    <img class="lines-bar" alt="">
    <section class="ui">
      <div class="display balance"><div class="control-box"><span class="label">BALANCE</span><b id="balance" class="value">10000</b></div></div>
      <div class="display bet"><div class="control-box"><span class="label">BET</span><b id="bet" class="value">50</b></div></div>
      <div class="display lines"><div class="control-box"><span class="label">LINES</span><b id="lines" class="value">20</b></div></div>
      <div class="display win"><div class="control-box"><span class="label">WIN</span><b id="win" class="value">0</b></div></div>
      <div class="display jackpot"><span class="label" id="jackpotLabel">JACKPOT</span> <b id="jackpot">75420</b></div>
      <button id="spin" class="spin" type="button" aria-label="Girar"><img class="spin-art spin-art-normal" alt=""><img class="spin-art spin-art-pressed" alt=""></button>
      <button id="minus" class="betminus">−</button><button id="plus" class="betplus">+</button>
      <button id="lineUp" class="lineup" aria-label="Más líneas">+</button><button id="lineDown" class="linedown" aria-label="Menos líneas">−</button>
      <button id="autoSpin" class="auto-spin" type="button" aria-pressed="false">AUTO</button><button id="menu" class="menu">MENU</button>
    </section>
  </main>
  <button id="autoStopOverlay" class="auto-stop-overlay" type="button">PARAR AUTO</button>
  <div id="paytableModal" class="paytable-modal" aria-hidden="true">
    <div class="paytable-card">
      <button id="closePaytable" class="paytable-close" aria-label="Cerrar">×</button>
      <div class="paytable-brand"></div><h2></h2><p class="paytable-subtitle"></p>
      <table><thead><tr></tr></thead><tbody id="paytableRows"></tbody></table>
      <div class="paytable-rules"><b></b></div>
    </div>
  </div>
  <script src="phaser.min.js?v=4.2.1"></script>
  <script src="themes/duendesitas-fortuna.js?v=150-silhouette-effects-final"></script>
  <script src="main.js?v=cauldron-in-silhouette-final"></script>
<script>
/* Duendesitas-only prize celebration overlays. Fairy frames sourced from
   florenciaamor36-ship-it/animacion-por-capas-demo, animaciones-demo/duendesita/frames. */
(()=>{
  'use strict';
  const coinRoot='assets/duendesitas-fortuna/coins/';
  const coinUrls=['gold-rotation-01.png','gold-rotation-02.png','gold-rotation-03.png','gold-rotation-04.png','gold-rotation-05.png','gold-rotation-07.png','gold-idle-angled.png'].map(x=>coinRoot+x);
  const coinImages=coinUrls.map(src=>{const im=new Image();im.src=src;return im});
  const fairyUrls=Array.from({length:7},(_,i)=>`assets/duendesitas-fortuna/fairy/frames/frame_${String(i+1).padStart(2,'0')}.png`);
  const fairyImages=fairyUrls.map(src=>{const im=new Image();im.src=src;return im});
  const active=new Map();
  function start(screen){
    const canvas=screen.querySelector('.award-coin-fountain');
    const fairyStage=screen.querySelector('.award-fairy-stage');
    const fairyA=screen.querySelector('.award-fairy');
    const fairyB=screen.querySelector('.award-fairy-next');
    if(!canvas||!fairyStage||!fairyA||!fairyB)return;
    const ctx=canvas.getContext('2d',{alpha:true});
    const dpr=Math.min(window.devicePixelRatio||1,2);
    let raf=0,spawned=0,lastFrame=0,live=true;
    const coins=[];const maxCoins=55;
    const resize=()=>{const card=screen.querySelector('.lowwin-card,.bigwin-card');if(!card)return;const w=card.offsetWidth,h=card.offsetHeight;canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);fairy.style.height=Math.round(h*.34)+'px';fairy.style.top=`calc(50% - ${Math.round(h*.07)}px)`;ctx.setTransform(dpr,0,0,dpr,0,0)};
    resize();window.addEventListener('resize',resize);
    fairyA.src=fairyUrls[0];fairyB.src=fairyUrls[1];fairyA.style.opacity='1';fairyB.style.opacity='0';
    let fairyIndex=0,front=fairyA,back=fairyB;
    const dance=window.setInterval(()=>{if(!live){clearInterval(dance);return}fairyIndex=(fairyIndex+1)%fairyUrls.length;back.src=fairyUrls[fairyIndex];back.style.opacity='1';front.style.opacity='0';const old=front;front=back;back=old},135);
    const reset=()=>{const w=canvas.width/dpr,h=canvas.height/dpr,k=Math.max(.35,h/350);return{x:w/2+(Math.random()*12-6)*k,y:h*.70,vx:(Math.random()-.5)*5*k,vy:-(Math.random()*3+6)*k,g:.20*k,size:(Math.random()*5+8)*k,angle:Math.random()*Math.PI*2,spin:(Math.random()*.12+.045)*(Math.random()<.5?-1:1),alpha:1,life:0,lifeMax:150+Math.random()*70}};
    function tick(now){
      if(!live||!screen.classList.contains('open')){stop();return}
      const r={width:canvas.width/dpr,height:canvas.height/dpr};ctx.clearRect(0,0,r.width,r.height);
      if(spawned<maxCoins&&now-lastFrame>22){coins.push(reset());spawned++;lastFrame=now}
      for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.x+=c.vx;c.y+=c.vy;c.vy+=c.g;c.angle+=c.spin;c.life++;if(c.y<r.height*.18){c.vy=Math.abs(c.vy)*.72;c.vx*=.92}if(c.x<c.size||c.x>r.width-c.size)c.vx*=-.82;if(c.y>r.height+10||c.life>c.lifeMax){Object.assign(c,reset())}c.alpha=Math.min(1,c.life/8,Math.max(.12,(c.lifeMax-c.life)/25))
        const phase=((c.angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);const frame=coinImages[Math.floor(phase/(Math.PI*2)*coinImages.length)%coinImages.length];
        if(!frame.complete||!frame.naturalWidth)continue;
        const h=c.size*2,w=h*frame.naturalWidth/frame.naturalHeight,flip=Math.max(.10,Math.abs(Math.cos(c.angle)));
        ctx.save();ctx.globalAlpha=c.alpha;ctx.translate(c.x,c.y);ctx.scale(flip,1);ctx.drawImage(frame,-w/2,-h/2,w,h);ctx.restore();
      }
      raf=requestAnimationFrame(tick)
    }
    function stop(){if(!live)return;live=false;cancelAnimationFrame(raf);clearInterval(dance);window.removeEventListener('resize',resize);ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);fairyA.removeAttribute('src');fairyB.removeAttribute('src');active.delete(screen)}
    active.set(screen,stop);raf=requestAnimationFrame(tick)
  }
  function restart(id){const screen=document.getElementById(id);if(!screen)return;active.get(screen)?.();requestAnimationFrame(()=>{if(screen.classList.contains('open'))start(screen)})}
  window.addEventListener('slot:low-win-start',()=>restart('lowWinScreen'));
  window.addEventListener('slot:big-win-start',()=>restart('bigWinScreen'));
  // Preview only; does not spin, change credits, or modify game math.
  const preview=new URLSearchParams(location.search).get('duende-award-preview');
  if(preview==='nice'||preview==='big')window.addEventListener('load',()=>setTimeout(()=>{if(preview==='big')showBigWin(500);else showLowWin(250)},1800),{once:true});
  for(const id of ['lowWinScreen','bigWinScreen']){const screen=document.getElementById(id);if(screen)new MutationObserver(()=>{if(!screen.classList.contains('open'))active.get(screen)?.()}).observe(screen,{attributes:true,attributeFilter:['class']})}
})();
</script>


</body>
</html>
