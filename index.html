<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Spins</title><link rel="stylesheet" href="style.css?v=16"></head>
<body><main id="game" class="game"><picture class="frame"><source media="(max-width:700px)" srcset="assets/frame-mobile.png"><img src="assets/frame-pc.png" alt="Marco Halloween"></picture><section id="reels" class="reels" aria-label="Rodillos"><div id="grid"></div></section><section class="ui"><div class="display balance">BALANCE <b id="balance">10000</b></div><div class="display bet">BET <b id="bet">50</b></div><div class="display lines">LINES <b id="lines">25</b></div><div class="display win">WIN <b id="win">0</b></div><div class="display jackpot">JACKPOT <b id="jackpot">75420</b></div><button id="spin" class="spin">SPIN</button><button id="minus" class="betminus">−</button><button id="plus" class="betplus">+</button><button id="lineUp" class="lineup">▲</button><button id="lineDown" class="linedown">▼</button><button id="menu" class="menu">MENU</button></section></main><script src="main.js?v=16"></script></body></html>
