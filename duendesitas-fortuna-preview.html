<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a002c">
<title>Duendesitas de la Fortuna · Halloween Spins</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#1a002c}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.game{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#1a002c}.game-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}#firefliesCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.nav{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:10px;pointer-events:none}.nav a,.toggle{pointer-events:auto;text-decoration:none;border:1px solid #f6d56d;color:#fff2b8;background:#190d2ac9;padding:10px 14px;border-radius:999px;font:700 13px system-ui,sans-serif;box-shadow:0 2px 12px #0008;backdrop-filter:blur(5px)}.toggle{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));cursor:pointer;font-size:14px}.toggle[aria-pressed="false"]{opacity:.8}
.loading-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#1a002c;opacity:1;visibility:visible;transition:opacity .65s ease,visibility .65s}.loading-screen.done{opacity:0;visibility:hidden;pointer-events:none}.loading-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.loading-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#11052018 48%,#10051c88 100%)}.loading-ui{position:absolute;z-index:3;left:12%;right:12%;bottom:max(8vh,54px);text-align:center;color:#fff4c2;font:700 14px system-ui,sans-serif;text-shadow:0 2px 5px #16051e}.load-track{height:14px;padding:2px;border:1px solid #ffe08c;border-radius:999px;background:#1a0d2bc9;box-shadow:0 0 14px #ffd85c88;overflow:hidden}.load-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#9eeb63,#ffe680,#ffbd36);box-shadow:0 0 10px #ffe680;transition:width .18s linear}.load-caption{margin-top:10px;letter-spacing:.04em}.loading-screen #loadingFireflies{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}@media(prefers-reduced-motion:reduce){.loading-screen{transition:none}}
</style></head>
<body><main class="game"><img src="assets/duendesitas-fortuna/background.jpg" alt="Arte original de Duendesitas de la Fortuna" class="game-background"><canvas id="firefliesCanvas" aria-hidden="true"></canvas><nav class="nav"><a href="index.html">← Halloween Spins</a><a href="duendesitas-fortuna-preview.html" aria-current="page">Duendesitas de la Fortuna</a></nav><button class="toggle" id="toggle" type="button" aria-pressed="true">Pausar luciérnagas</button></main><section class="loading-screen" id="loadingScreen" aria-label="Cargando Duendesitas de la Fortuna"><canvas id="loadingFireflies" aria-hidden="true"></canvas><img class="loading-background" src="assets/duendesitas-fortuna/loading-screen.jpg" alt="Pantalla de carga de Duendesitas de la Fortuna"><div class="loading-shade"></div><div class="loading-ui"><div class="load-track"><div class="load-fill" id="loadFill"></div></div><div class="load-caption"><span id="loadMessage">Cargando</span> <span id="loadPercent">0%</span></div></div></section>
<script>
(()=>{'use strict';const canvas=document.getElementById('firefliesCanvas'),loadCanvas=document.getElementById('loadingFireflies'),canvases=[canvas,loadCanvas],contexts=canvases.map(c=>c.getContext('2d')),button=document.getElementById('toggle');let w=0,h=0,dpr=1,running=true,last=0,raf=0;const FIREFLY_COUNT=45,colors=['255, 223, 100','255, 191, 0','212, 255, 120'],fireflies=[];
function resizeCanvas(){const rect=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=rect.width;h=rect.height;for(let i=0;i<canvases.length;i++){canvases[i].width=Math.max(1,Math.round(w*dpr));canvases[i].height=Math.max(1,Math.round(h*dpr));contexts[i].setTransform(dpr,0,0,dpr,0,0)}for(const f of fireflies){f.x=Math.min(w,Math.max(0,f.x));f.y=Math.min(h,Math.max(0,f.y))}}window.addEventListener('resize',resizeCanvas,{passive:true});
class Firefly{constructor(){this.reset(true)}reset(initial=false){this.x=Math.random()*w;this.y=Math.random()*h;this.radius=Math.random()*2.5+1;this.phase=Math.random()*Math.PI*2;this.fadeSpeed=Math.random()*.01+.005;this.speedX=(Math.random()-.5)*.6;this.speedY=(Math.random()-.5)*.6;this.color=colors[Math.floor(Math.random()*colors.length)];this.alpha=.15+.8*Math.random();if(!initial){if(Math.random()<.5)this.x=this.speedX>0?0:w;else this.y=this.speedY>0?0:h}}update(dt){const k=dt/16.667;this.x+=this.speedX*k;this.y+=this.speedY*k;this.phase+=this.fadeSpeed*k;this.alpha=.1+.9*(.5+.5*Math.sin(this.phase));if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset()}draw(ctx){ctx.save();ctx.shadowBlur=this.radius*4;ctx.shadowColor=`rgba(${this.color},${this.alpha})`;ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.alpha})`;ctx.fill();ctx.restore()}}
function animate(now){if(!running){raf=0;return}const dt=Math.min(50,now-last||16.667);last=now;for(const ctx of contexts)ctx.clearRect(0,0,w,h);for(const f of fireflies){f.update(dt);for(const ctx of contexts)f.draw(ctx)}raf=requestAnimationFrame(animate)}function start(){running=true;button.textContent='Pausar luciérnagas';button.setAttribute('aria-pressed','true');last=performance.now();if(!raf)raf=requestAnimationFrame(animate)}function stop(){running=false;button.textContent='Reanudar luciérnagas';button.setAttribute('aria-pressed','false');if(raf)cancelAnimationFrame(raf);raf=0;for(const ctx of contexts)ctx.clearRect(0,0,w,h)}button.addEventListener('click',()=>running?stop():start());resizeCanvas();for(let i=0;i<FIREFLY_COUNT;i++)fireflies.push(new Firefly());start();
const loading=document.getElementById('loadingScreen'),fill=document.getElementById('loadFill'),percent=document.getElementById('loadPercent'),message=document.getElementById('loadMessage'),loadArt=loading.querySelector('.loading-background'),gameArt=document.querySelector('.game-background');let progress=0;const begin=performance.now();function updateLoad(){const elapsed=performance.now()-begin;const assetsReady=loadArt.complete&&loadArt.naturalWidth>0&&gameArt.complete&&gameArt.naturalWidth>0;const goal=assetsReady?Math.min(100,Math.floor(elapsed/24)):Math.min(82,Math.floor(elapsed/42));progress=Math.max(progress,goal);fill.style.width=progress+'%';percent.textContent=progress+'%';if(progress>=100){message.textContent='¡Listo!';setTimeout(()=>loading.classList.add('done'),350);return}requestAnimationFrame(updateLoad)}requestAnimationFrame(updateLoad)})();
</script></body></html>
