<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a002c">
<title>Duendesitas de la Fortuna · Halloween Spins</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#1a002c}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.game{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#1a002c}.game-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}#firefliesCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.nav{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:10px;pointer-events:none}.nav a,.toggle{pointer-events:auto;text-decoration:none;border:1px solid #f6d56d;color:#fff2b8;background:#190d2ac9;padding:10px 14px;border-radius:999px;font:700 13px system-ui,sans-serif;box-shadow:0 2px 12px #0008;backdrop-filter:blur(5px)}.toggle{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));cursor:pointer;font-size:14px}.toggle[aria-pressed="false"]{opacity:.8}
</style></head>
<body><main class="game"><img src="assets/duendesitas-fortuna/background.jpg" alt="Arte original de Duendesitas de la Fortuna" class="game-background"><canvas id="firefliesCanvas" aria-hidden="true"></canvas><nav class="nav"><a href="index.html">← Halloween Spins</a><a href="duendesitas-fortuna-preview.html" aria-current="page">Duendesitas de la Fortuna</a></nav><button class="toggle" id="toggle" type="button" aria-pressed="true">Pausar luciérnagas</button></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('firefliesCanvas'),ctx=canvas.getContext('2d'),button=document.getElementById('toggle');let w=0,h=0,dpr=1,running=true,last=0,raf=0;const FIREFLY_COUNT=45,colors=['255, 223, 100','255, 191, 0','212, 255, 120'],fireflies=[];
function resizeCanvas(){const rect=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=rect.width;h=rect.height;canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);for(const f of fireflies){f.x=Math.min(w,Math.max(0,f.x));f.y=Math.min(h,Math.max(0,f.y))}}window.addEventListener('resize',resizeCanvas,{passive:true});
class Firefly{constructor(){this.reset(true)}reset(initial=false){this.x=Math.random()*w;this.y=Math.random()*h;this.radius=Math.random()*2.5+1;this.phase=Math.random()*Math.PI*2;this.fadeSpeed=Math.random()*.01+.005;this.speedX=(Math.random()-.5)*.6;this.speedY=(Math.random()-.5)*.6;this.color=colors[Math.floor(Math.random()*colors.length)];this.alpha=.15+.8*Math.random();if(!initial){if(Math.random()<.5)this.x=this.speedX>0?0:w;else this.y=this.speedY>0?0:h}}update(dt){const k=dt/16.667;this.x+=this.speedX*k;this.y+=this.speedY*k;this.phase+=this.fadeSpeed*k;this.alpha=.1+.9*(.5+.5*Math.sin(this.phase));if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset()}draw(){ctx.save();ctx.shadowBlur=this.radius*4;ctx.shadowColor=`rgba(${this.color},${this.alpha})`;ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.alpha})`;ctx.fill();ctx.restore()}}
function animate(now){if(!running){raf=0;return}const dt=Math.min(50,now-last||16.667);last=now;ctx.clearRect(0,0,w,h);for(const f of fireflies){f.update(dt);f.draw()}raf=requestAnimationFrame(animate)}function start(){running=true;button.textContent='Pausar luciérnagas';button.setAttribute('aria-pressed','true');last=performance.now();if(!raf)raf=requestAnimationFrame(animate)}function stop(){running=false;button.textContent='Reanudar luciérnagas';button.setAttribute('aria-pressed','false');if(raf)cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,w,h)}button.addEventListener('click',()=>running?stop():start());resizeCanvas();for(let i=0;i<FIREFLY_COUNT;i++)fireflies.push(new Firefly());start()})();
</script></body></html>
