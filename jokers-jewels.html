<!doctype html>
<html lang="es" data-skin="jokers-jewels">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#160a27">
  <title>Joker's Jewels</title>
  <link rel="manifest" href="jokers-jewels.webmanifest?v=1">
  <script src="orientation-lock.js?v=portrait-lock-1" defer></script>
  <link rel="preload" as="image" href="assets/jokers-jewels/loading-screen.webp?v=poster-20260928-0047" fetchpriority="high">
  <link rel="stylesheet" href="style.css?v=single-portrait-15">
  <link rel="stylesheet" href="themes/skin-tokens.css?v=skin-refactor-1">
  <link rel="stylesheet" href="shared-portrait.css?v=single-canvas-2">
  <link rel="stylesheet" href="themes/jokers-jewels.css?v=loading-poster-20260928-0047">
</head>
<body>
  <div class="orientation-warning" role="status" aria-live="polite">Poné el teléfono en vertical para jugar.</div>
  <section id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="loading-canvas">
      <img class="loading-art" src="assets/jokers-jewels/loading-screen.webp?v=poster-20260928-0047" alt="" fetchpriority="high" decoding="sync">
      <div class="loading-ui"><div class="loading-track"><div id="loadingBar" class="loading-fill"></div></div>
        <div class="loading-status"><span id="loadingMessage">Cargando Joker's Jewels</span><span id="loadingDots">...</span> <b id="loadingPercent">0%</b></div>
      </div>
    </div>
  </section>
  <section id="lowWinScreen" class="lowwin-screen" aria-hidden="true">
    <div id="lowWinParticles" class="lowwin-particles"></div>
    <div class="lowwin-card"><img alt=""><div class="lowwin-title"></div><div class="lowwin-amount"><span id="lowWinNumber">0</span></div></div>
  </section>
  <section id="bigWinScreen" class="bigwin-screen" aria-hidden="true">
    <div class="bigwin-rays"></div><div id="bigWinParticles" class="bigwin-particles"></div><div class="bigwin-lights"></div>
    <div class="bigwin-card"><img class="bigwin-art" alt=""><div class="bigwin-number-cover"><div id="bigWinNumber" class="bigwin-number">0</div></div></div>
  </section>
  <main id="game" class="game">
    <picture class="frame"><source media="all"><img alt=""></picture>
    <img class="bet-bar" alt=""><img class="balance-bar" alt="">
    <section id="reels" class="reels" aria-label="Rodillos"></section>
    <section id="announcementPanel" class="announcement-panel" aria-label="Anuncios del juego"><img alt=""><div id="announcementText" class="announcement-text"></div></section>
    <img class="lines-bar" alt="">
    <section class="ui">
      <div class="display balance"><div class="control-box"><span class="label">SALDO</span><b id="balance" class="value">10000</b></div></div>
      <div class="display bet"><div class="control-box"><span class="label">APUESTA</span><b id="bet" class="value">50</b></div></div>
      <div class="display lines"><div class="control-box"><span class="label">LÍNEAS</span><b id="lines" class="value">20</b></div></div>
      <div class="display win"><div class="control-box"><span class="label">PREMIO</span><b id="win" class="value">0</b></div></div>
      <div class="display jackpot"><span class="label" id="jackpotLabel">JACKPOT</span> <b id="jackpot">0</b></div>
      <button id="spin" class="spin" type="button" aria-label="Girar"><img class="spin-art spin-art-normal" alt=""><img class="spin-art spin-art-pressed" alt=""></button>
      <button id="minus" class="betminus" type="button" aria-label="Bajar apuesta">−</button><button id="plus" class="betplus" type="button" aria-label="Subir apuesta">+</button>
      <button id="lineUp" class="lineup" type="button" aria-label="Más líneas">+</button><button id="lineDown" class="linedown" type="button" aria-label="Menos líneas">−</button>
      <button id="autoSpin" class="auto-spin" type="button" aria-label="Autotiradas" aria-pressed="false">AUTO</button>
      <button id="menu" class="menu" type="button" aria-label="Menú"></button>
      <button id="jjInfo" class="jj-frame-control jj-info" type="button" aria-label="Información y tabla de premios"></button>
      <button id="jjTurbo" class="jj-frame-control jj-turbo" type="button" aria-label="Turbo"></button>
      <button id="jjBetMenu" class="jj-frame-control jj-bet-menu" type="button" aria-label="Configurar apuesta"></button>
      <button id="jjSettings" class="jj-frame-control jj-settings" type="button" aria-label="Configuración"></button>
    </section>
  </main>
  <button id="autoStopOverlay" class="auto-stop-overlay" type="button">PARAR AUTO</button>
  <div id="paytableModal" class="paytable-modal" aria-hidden="true">
    <div class="paytable-card"><button id="closePaytable" class="paytable-close" aria-label="Cerrar">×</button>
      <div class="paytable-brand"></div><h2></h2><p class="paytable-subtitle"></p>
      <table><thead><tr></tr></thead><tbody id="paytableRows"></tbody></table><div class="paytable-rules"><b></b></div>
    </div>
  </div>
  <div id="jjAutoModal" class="jj-modal" aria-hidden="true">
    <section class="jj-dialog" role="dialog" aria-modal="true" aria-labelledby="jjAutoTitle">
      <button class="jj-close" type="button" data-jj-close="jjAutoModal" aria-label="Cerrar">×</button>
      <h2 id="jjAutoTitle">AUTO</h2><p>Elegí cuántas tiradas automáticas hacer.</p>
      <div class="jj-dialog-actions"><button type="button" data-auto-spins="10">10</button><button type="button" data-auto-spins="25">25</button><button type="button" data-auto-spins="50">50</button></div>
      <button class="jj-cancel" type="button" data-jj-close="jjAutoModal">Cancelar</button>
    </section>
  </div>
  <div id="jjBetModal" class="jj-modal" aria-hidden="true">
    <section class="jj-dialog" role="dialog" aria-modal="true" aria-labelledby="jjBetTitle">
      <button class="jj-close" type="button" data-jj-close="jjBetModal" aria-label="Cerrar">×</button>
      <h2 id="jjBetTitle">APUESTA</h2><p>Las 5 líneas son fijas.</p>
      <div class="jj-bet-summary"><span>Monedas por línea</span><b id="jjCoinsPerLine">10</b><span>Valor de ficha</span><b>1</b><span>Apuesta total</span><b id="jjBetTotal">50</b></div>
      <div class="jj-dialog-actions"><button type="button" data-jj-bet="-1" aria-label="Bajar apuesta">−</button><button type="button" data-jj-bet="1" aria-label="Subir apuesta">+</button><button type="button" id="jjBetMax">MÁX</button></div>
    </section>
  </div>
  <div id="jjMenuModal" class="jj-modal" aria-hidden="true">
    <section class="jj-dialog" role="dialog" aria-modal="true" aria-labelledby="jjMenuTitle">
      <button class="jj-close" type="button" data-jj-close="jjMenuModal" aria-label="Cerrar">×</button>
      <h2 id="jjMenuTitle">JOKER’S JEWELS</h2>
      <div class="jj-menu-actions"><button type="button" id="jjMenuPrizes">Premios y reglas</button><button type="button" id="jjMenuSettings">Configuración</button></div>
      <button class="jj-cancel" type="button" data-jj-close="jjMenuModal">Volver al juego</button>
    </section>
  </div>
  <div id="jjSettingsModal" class="jj-modal" aria-hidden="true">
    <section class="jj-dialog" role="dialog" aria-modal="true" aria-labelledby="jjSettingsTitle">
      <button class="jj-close" type="button" data-jj-close="jjSettingsModal" aria-label="Cerrar">×</button>
      <h2 id="jjSettingsTitle">CONFIGURACIÓN</h2>
      <button id="jjSoundToggle" class="jj-sound-toggle" type="button" aria-pressed="true">Sonido: activado</button>
      <button class="jj-cancel" type="button" data-jj-close="jjSettingsModal">Listo</button>
    </section>
  </div>
  <script src="phaser.min.js?v=4.2.1"></script>
  <script src="themes/jokers-jewels.js?v=rules-controls-20260927-2012"></script>
  <script src="main.js?v=big-win-pair-20260928-0103"></script>
  <script src="themes/jokers-jewels-audio.js?v=big-win-pair-20260928-0103"></script>
  <script src="themes/jokers-jewels-ui.js?v=buttons-20260927-2012"></script>
</body>
</html>
